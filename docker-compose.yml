version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lifeos-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeosdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: lifeos-ai-services
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=AIzaSyAJ-Pfi4iezpsBYHMR1Ok43vB32MCRwbIM
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./datasets:/datasets
      - ./ml-models:/ml-models

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeos-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lifeosdb
      - JWT_SECRET=lifeos_secret
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai-services:8000
    depends_on:
      - postgres
      - ai-services

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeos-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  postgres-data:
