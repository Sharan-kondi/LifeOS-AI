services:
  - type: web
    name: lifeos-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: lifeos_secret
      - key: PORT
        value: 5000
      - key: AI_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
